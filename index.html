<!DOCTYPE html>
<html>

<head>

<title>MedClue - Medical Detective Academy</title>

<div class="card">

<h3>📁 Case File</h3>

<div id="patient"></div>

</div>

<link rel="stylesheet" href="css/style.css">

</head>


<body>


<div class="game-container">


<h1>🩺 MedClue</h1>

<h2>Medical Detective Academy</h2>


<div class="card">

<h3>🧠 Differential Diagnosis</h3>

<p>
Drag possible diagnoses here:
</p>


<div id="diagnosis"></div>


<div id="selected"
ondragover="event.preventDefault()"
ondrop="dropDiagnosis(event)">

Drop diagnosis here

</div>


<button onclick="submitDiagnosis()">
Submit Diagnosis
</button>


</div>



<div class="card">

<h3>🏥 Hospital Investigation</h3>

<div id="rooms"></div>

<div id="history"></div>
<div id="examination"></div>
<div id="investigation"></div>

</div>


<div class="card">

<h3>📋 Evidence Board</h3>

<div id="evidence">

<p>No evidence collected yet.</p>

</div>

</div>



<div class="card">

<h3>🧠 Final Diagnosis</h3>



</div>



<h2 id="result"></h2>


<div class="xp">

⭐ XP: <span id="score">0</span>

</div>


</div>


<script src="data/cases.js"></script>

<script src="js/systems/evidence.js"></script>

<script src="js/systems/history.js"></script>

<script src="js/systems/examination.js"></script>

<script src="js/systems/investigation.js"></script>
<script src="js/systems/diagnosis.js"></script>

<script src="js/game.js"></script>


</body>

</html>
